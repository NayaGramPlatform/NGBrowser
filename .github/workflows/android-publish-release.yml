name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'
      release_title:
        description: 'Release Title'
        required: false
        default: 'NG Browser v1.0.1 Official Release'
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build Signed APK & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Decode Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD_2 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/ngbrowser-release.jks"
          CLEAN_STORE_PASS=$(printf "%s" "$RELEASE_STORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_ALIAS=$(printf "%s" "$RELEASE_KEY_ALIAS" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf "%s" "$RELEASE_KEY_PASSWORD" | tr -d '\r\n')

          if keytool -certreq -keystore "$RUNNER_TEMP/ngbrowser-release.jks" -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_KEY_ALIAS" -keypass "$CLEAN_KEY_PASS" -file /dev/null 2>/dev/null; then
            FINAL_KEY_PASS="$CLEAN_KEY_PASS"
          else
            FINAL_KEY_PASS="$CLEAN_STORE_PASS"
          fi

          echo "KEYSTORE_PATH=$RUNNER_TEMP/ngbrowser-release.jks" >> "$GITHUB_ENV"
          echo "SAFE_STORE_PASS=$CLEAN_STORE_PASS" >> "$GITHUB_ENV"
          echo "SAFE_KEY_ALIAS=$CLEAN_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SAFE_KEY_PASS=$FINAL_KEY_PASS" >> "$GITHUB_ENV"

      - name: 4. Grant execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: 5. Build signed release APK & AAB
        env:
          RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          RELEASE_KEY_ALIAS: ${{ env.SAFE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ env.SAFE_STORE_PASS }}
          RELEASE_KEY_PASSWORD: ${{ env.SAFE_KEY_PASS }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace \
            "-PRELEASE_STORE_FILE=$KEYSTORE_PATH" \
            "-PRELEASE_KEY_ALIAS=$SAFE_KEY_ALIAS" \
            "-PRELEASE_STORE_PASSWORD=$SAFE_STORE_PASS" \
            "-PRELEASE_KEY_PASSWORD=$SAFE_KEY_PASS"

      - name: 6. Create GitHub Release & Attach Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          body: |
            ## 🚀 NG Browser Official Release
            **NayaGram Platform**

            ### 📦 Download Links
            - **Release APK**: Direct Android installation file
            - **Release AAB**: Google Play Store publishing bundle
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ngbrowser-release.jks"
