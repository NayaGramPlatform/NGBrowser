name: Android CI & Quality Check

on:
  push:
    branches:
      - MasterPro
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    branches:
      - MasterPro
      - main

jobs:
  check-and-debug-build:
    name: Lint, Test & Assemble Debug
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Grant execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: 4. Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 5. Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
