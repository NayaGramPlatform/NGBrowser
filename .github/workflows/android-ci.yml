name: Android CI & Quality Check

on:
  push:
    branches:
      - MasterPro
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    branches:
      - MasterPro

jobs:
  check-and-debug-build:
    name: Compile & Assemble NG Browser Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Grant execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: 4. Build Debug APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: 5. Upload NG Browser Debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-v3.12.18-NG-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
