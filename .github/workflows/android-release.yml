name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Sign NG Browser Release (AAB + Split APKs)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Decode & verify release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD_2 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is empty or not configured!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/ngbrowser-release.jks"
          if [ ! -s "$RUNNER_TEMP/ngbrowser-release.jks" ]; then
            echo "::error::Failed to decode keystore file or file is empty!"
            exit 1
          fi

          CLEAN_STORE_PASS=$(printf "%s" "$RELEASE_STORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_ALIAS=$(printf "%s" "$RELEASE_KEY_ALIAS" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf "%s" "$RELEASE_KEY_PASSWORD" | tr -d '\r\n')

          keytool -list -keystore "$RUNNER_TEMP/ngbrowser-release.jks" \
            -storepass "$CLEAN_STORE_PASS" \
            -alias "$CLEAN_KEY_ALIAS"

          if keytool -certreq -keystore "$RUNNER_TEMP/ngbrowser-release.jks" -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_KEY_ALIAS" -keypass "$CLEAN_KEY_PASS" -file /dev/null 2>/dev/null; then
            FINAL_KEY_PASS="$CLEAN_KEY_PASS"
          elif keytool -certreq -keystore "$RUNNER_TEMP/ngbrowser-release.jks" -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_KEY_ALIAS" -keypass "$CLEAN_STORE_PASS" -file /dev/null 2>/dev/null; then
            FINAL_KEY_PASS="$CLEAN_STORE_PASS"
          else
            echo "::error::Could not unlock private key with provided secrets!"
            exit 1
          fi

          echo "KEYSTORE_PATH=$RUNNER_TEMP/ngbrowser-release.jks" >> "$GITHUB_ENV"
          echo "SAFE_STORE_PASS=$CLEAN_STORE_PASS" >> "$GITHUB_ENV"
          echo "SAFE_KEY_ALIAS=$CLEAN_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SAFE_KEY_PASS=$FINAL_KEY_PASS" >> "$GITHUB_ENV"

      - name: 4. Grant execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: 5. Build signed NG Browser AAB & Split APKs
        env:
          RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          RELEASE_KEY_ALIAS: ${{ env.SAFE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ env.SAFE_STORE_PASS }}
          RELEASE_KEY_PASSWORD: ${{ env.SAFE_KEY_PASS }}
        run: |
          ./gradlew clean bundleRelease assembleRelease --no-daemon --stacktrace \
            "-PRELEASE_STORE_FILE=$KEYSTORE_PATH" \
            "-PRELEASE_KEY_ALIAS=$SAFE_KEY_ALIAS" \
            "-PRELEASE_STORE_PASSWORD=$SAFE_STORE_PASS" \
            "-PRELEASE_KEY_PASSWORD=$SAFE_KEY_PASS"

      - name: 6. Prepare branded filenames & verify signatures
        run: |
          mkdir -p release-dist/aab release-dist/apk
          AAB_SRC=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          ARM64_SRC=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -n 1)
          ARM32_SRC=$(ls app/build/outputs/apk/release/*armeabi-v7a*.apk | head -n 1)

          cp "$AAB_SRC" "release-dist/aab/NGBrowser-v3.12.18-NG.aab"
          cp "$ARM64_SRC" "release-dist/apk/NGBrowser-v3.12.18-NG-arm64-v8a.apk"
          cp "$ARM32_SRC" "release-dist/apk/NGBrowser-v3.12.18-NG-armeabi-v7a.apk"

          ls -lh release-dist/aab/ release-dist/apk/
          jarsigner -verify -verbose:summary "release-dist/aab/NGBrowser-v3.12.18-NG.aab"
          jarsigner -verify -verbose:summary "release-dist/apk/NGBrowser-v3.12.18-NG-arm64-v8a.apk"
          jarsigner -verify -verbose:summary "release-dist/apk/NGBrowser-v3.12.18-NG-armeabi-v7a.apk"
          sha256sum release-dist/aab/*.aab release-dist/apk/*.apk

      - name: 7. Upload signed NG Browser AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-v3.12.18-NG-AAB
          path: release-dist/aab/NGBrowser-v3.12.18-NG.aab
          if-no-files-found: error

      - name: 8. Upload signed NG Browser APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-v3.12.18-NG-APK
          path: release-dist/apk/*.apk
          if-no-files-found: error

      - name: 9. Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ngbrowser-release.jks"
