name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Sign Release
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD_2 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is empty or not configured!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ngbrowser-release.jks"
          if [ ! -s "$RUNNER_TEMP/ngbrowser-release.jks" ]; then
            echo "::error::Failed to decode keystore file or file is empty!"
            exit 1
          fi
          echo "Keystore successfully decoded to $RUNNER_TEMP/ngbrowser-release.jks"

          # Verify keystore store password
          keytool -list -keystore "$RUNNER_TEMP/ngbrowser-release.jks" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS"

          # Check which key password unlocks the key entry
          CHOSEN_KEY_PASS="$RELEASE_KEY_PASSWORD"
          if ! keytool -certreq -keystore "$RUNNER_TEMP/ngbrowser-release.jks" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" -file /dev/null 2>/dev/null; then
            echo "RELEASE_STORE_PASSWORD_2 could not recover key entry. Testing RELEASE_STORE_PASSWORD as keypass..."
            if keytool -certreq -keystore "$RUNNER_TEMP/ngbrowser-release.jks" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_STORE_PASSWORD" -file /dev/null 2>/dev/null; then
              echo "Key entry verified successfully using RELEASE_STORE_PASSWORD!"
              CHOSEN_KEY_PASS="$RELEASE_STORE_PASSWORD"
            else
              echo "::error::Neither RELEASE_STORE_PASSWORD_2 nor RELEASE_STORE_PASSWORD could unlock alias '$RELEASE_KEY_ALIAS'!"
              exit 1
            fi
          else
            echo "Key entry successfully verified with RELEASE_STORE_PASSWORD_2!"
          fi

          echo "VERIFIED_KEY_PASS=$CHOSEN_KEY_PASS" >> "$GITHUB_ENV"

      - name: 5. Grant execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: 6. Build signed release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/ngbrowser-release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ env.VERIFIED_KEY_PASS }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/ngbrowser-release.jks" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: 7. Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 7. Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 8. Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ngbrowser-release.jks"
