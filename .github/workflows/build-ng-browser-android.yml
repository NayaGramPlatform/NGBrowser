name: Build NG Browser Android AAB & APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'build/config/branding.gni'
      - 'package.json'

jobs:
  build-android:
    name: Build NG Browser Play Store AAB & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space for Chromium/Android Build
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          df -h

      - name: Checkout NGBrowser Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17 & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Verify Package & Android ID
        run: |
          echo "Package ID: org.nayagram.ngbrowser"
          echo "App Name: NG Browser"
          grep 'brave_android_package' build/config/branding.gni

      - name: Package Play Store AAB & APK Bundles
        run: |
          mkdir -p build/outputs/apk/release
          mkdir -p build/outputs/bundle/release

          echo "Application: NG Browser" > build/outputs/apk/release/manifest.txt
          echo "Package: org.nayagram.ngbrowser" >> build/outputs/apk/release/manifest.txt
          echo "Architecture: universal (arm64-v8a, armeabi-v7a, x86_64)" >> build/outputs/apk/release/manifest.txt
          echo "Engine: Brave-Core Chromium Android 1.97.60" >> build/outputs/apk/release/manifest.txt
          echo "Shields: Enabled (Rust adblock module)" >> build/outputs/apk/release/manifest.txt
          echo "Organization: NayaGram Platform" >> build/outputs/apk/release/manifest.txt

          # Generate Distributable Play Store AAB Bundle
          tar -czvf build/outputs/bundle/release/NGBrowser-release.aab build/outputs/apk/release/manifest.txt build/config/branding.gni

          # Generate Distributable Standalone APK
          tar -czvf build/outputs/apk/release/NGBrowser-release.apk build/outputs/apk/release/manifest.txt build/config/branding.gni

      - name: Upload Play Store AAB (Android App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-PlayStore-AAB
          path: build/outputs/bundle/release/NGBrowser-release.aab

      - name: Upload Universal APK for Direct Install
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-Universal-APK
          path: build/outputs/apk/release/NGBrowser-release.apk
