name: Build Signed NG Browser (AAB & APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ng-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package NG Browser
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'NayaGram2026SecurePass!' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ngbrowser' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'NayaGram2026SecurePass!' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # full history of this huge repo is not needed

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9 (compatible with AGP 8.7)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permissions on Gradlew
        run: chmod +x gradlew

      - name: Prepare Persistent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding persistent keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 not set - generating a temporary keystore."
            keytool -genkeypair -v -keystore keystore/release.jks \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=NayaGram Platform, OU=NG Browser, O=NayaGram Platform, L=Dhaka, C=BD"
          fi

      - name: Build Signed Release APK & AAB via Gradle
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Signed Artifacts & Validate Signature
        run: |
          mkdir -p artifacts_out
          VERSION_NAME="1.0.0"
          cp app/build/outputs/apk/release/app-release.apk artifacts_out/NGBrowser-v${VERSION_NAME}-Release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts_out/NGBrowser-v${VERSION_NAME}-Release.aab
          ls -lh artifacts_out/
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify -v artifacts_out/NGBrowser-v${VERSION_NAME}-Release.apk

      - name: Upload NGBrowser-Release-APK
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-Release-APK
          path: artifacts_out/*.apk

      - name: Upload NGBrowser-Release-AAB
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-Release-AAB
          path: artifacts_out/*.aab

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" artifacts_out/* \
            --title "NG Browser 1.0.0 (build ${{ github.run_number }})" \
            --notes "NG Browser Android APK and Play Store AAB by NayaGram Platform. Package: org.nayagram.ngbrowser." \
            --target "${{ github.sha }}"
