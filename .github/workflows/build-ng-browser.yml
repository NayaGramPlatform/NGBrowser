name: Build Signed NG Browser (AAB & APK)

on:
  push:
    branches: [ MasterPro, main ]
  pull_request:
    branches: [ MasterPro, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package NG Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permissions on Gradle Wrapper
        run: chmod +x gradlew

      # Google Play only accepts updates signed with the SAME upload key forever.
      # Add these 4 GitHub Secrets once: ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "play_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing. Building with a TEMPORARY key - do NOT upload this build to Google Play."
            TMP_PASS="tmp-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore keystore/release.jks -alias ngbrowser \
              -keyalg RSA -keysize 2048 -validity 30 -storepass "$TMP_PASS" -keypass "$TMP_PASS" \
              -dname "CN=NG Browser TEMP" > /dev/null
            echo "KEYSTORE_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=ngbrowser" >> "$GITHUB_ENV"
            echo "play_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load Signing Secrets
        if: steps.keystore.outputs.play_ready == 'true'
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'ngbrowser' }}" >> "$GITHUB_ENV"

      - name: Build Signed APK and AAB
        run: ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify Signed Artifacts
        run: |
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          mkdir -p artifacts_out
          cp app/build/outputs/apk/release/app-release.apk "artifacts_out/NGBrowser-v${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "artifacts_out/NGBrowser-v${VERSION_NAME}.aab"
          ls -lh artifacts_out/
          APKSIGNER="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify -v "artifacts_out/NGBrowser-v${VERSION_NAME}.apk"

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-AAB-v${{ env.VERSION_NAME }}
          path: artifacts_out/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-APK-v${{ env.VERSION_NAME }}
          path: artifacts_out/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.keystore.outputs.play_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION_NAME}" artifacts_out/* \
            --title "NG Browser v${VERSION_NAME}" \
            --notes "NG Browser for Android by NayaGram Platform. Package: org.nayagram.ngbrowser. Upload the .aab file to Google Play Console." \
            --target "${GITHUB_SHA}"
