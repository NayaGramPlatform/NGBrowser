name: Build Signed NG Browser (AAB & APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package NG Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Persistent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding persistent keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          else
            echo "Using persistent repository release keystore..."
            keytool -genkeypair -v -keystore keystore/release.jks \
              -alias ngbrowser -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || 'NayaGram2026SecurePass!' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'NayaGram2026SecurePass!' }}" \
              -dname "CN=NayaGram Platform, OU=NG Browser, O=NayaGram Platform, L=Dhaka, C=BD"
          fi

      - name: Build Signed APK & Play Store AAB via Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'NayaGram2026SecurePass!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ngbrowser' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'NayaGram2026SecurePass!' }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Verify Signed Artifacts & Validate Signature
        run: |
          mkdir -p artifacts_out
          cp app/build/outputs/apk/release/app-release.apk artifacts_out/NGBrowser-Release-APK.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts_out/NGBrowser-Release-AAB.aab
          
          VERSION_NAME="1.0.0"
          cp artifacts_out/NGBrowser-Release-APK.apk artifacts_out/NGBrowser-v${VERSION_NAME}-Release.apk
          cp artifacts_out/NGBrowser-Release-AAB.aab artifacts_out/NGBrowser-v${VERSION_NAME}-Release.aab

          echo "=== ARTIFACT EVIDENCE ==="
          ls -lh artifacts_out/
          
          echo "Verifying APK Signatures..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v artifacts_out/NGBrowser-Release-APK.apk

      - name: Upload NGBrowser-Release-AAB
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-Release-AAB
          path: artifacts_out/NGBrowser-Release-AAB.aab

      - name: Upload NGBrowser-Release-APK
        uses: actions/upload-artifact@v4
        with:
          name: NGBrowser-Release-APK
          path: artifacts_out/NGBrowser-Release-APK.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          echo "Creating or updating GitHub Release $TAG..."
          gh release create $TAG \
            artifacts_out/NGBrowser-Release-APK.apk \
            artifacts_out/NGBrowser-v1.0.0-Release.apk \
            artifacts_out/NGBrowser-Release-AAB.aab \
            artifacts_out/NGBrowser-v1.0.0-Release.aab \
            --title "NG Browser v1.0.0 Official Release" \
            --notes "Official Chromium & Brave-Core powered Android APK and Play Store AAB release by NayaGram Platform. Package: org.nayagram.ngbrowser." \
            --target main || true
