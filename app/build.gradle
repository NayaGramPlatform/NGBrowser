plugins {
    id 'com.android.application'
}

// Every Play Store upload needs a higher versionCode. CI passes GITHUB_RUN_NUMBER,
// so each GitHub build gets a new number automatically (100 + run number).
def ciRun = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
def releaseKeystore = rootProject.file("keystore/release.jks")

android {
    namespace 'org.nayagram.ngbrowser'
    compileSdk 35

    defaultConfig {
        applicationId "org.nayagram.ngbrowser"
        minSdk 24
        // Google Play requires new apps and updates to target a recent Android version.
        targetSdk 35
        versionCode 100 + ciRun
        versionName "1.0.${ciRun}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            // Passwords come ONLY from environment variables / GitHub Secrets.
            // Never write keystore passwords in this public repository.
            storeFile releaseKeystore
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: "ngbrowser"
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (releaseKeystore.exists() && System.getenv("KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
