plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nayagram.ngbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "org.nayagram.ngbrowser"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file("keystore/release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "NayaGram2026SecurePass!"
            keyAlias System.getenv("KEY_ALIAS") ?: "ngbrowser"
            keyPassword System.getenv("KEY_PASSWORD") ?: "NayaGram2026SecurePass!"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
