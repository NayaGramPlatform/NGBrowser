plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nayagram.ngbrowser'
    compileSdk 33

    defaultConfig {
        applicationId "org.nayagram.ngbrowser"
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def keystoreFile = file("keystore/release.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: System.getenv("STORE_PASSWORD") ?: "NayaGram2026SecurePass!"
                keyAlias System.getenv("KEY_ALIAS") ?: "ngbrowser"
                keyPassword System.getenv("KEY_PASSWORD") ?: "NayaGram2026SecurePass!"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = file("keystore/release.jks")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            def keystoreFile = file("keystore/release.jks")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
