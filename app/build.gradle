plugins {
    id 'com.android.application'
}

base {
    archivesName = "NGBrowser-v3.12.18-NG"
}

android {
    namespace 'org.nayagram.ngbrowser'
    compileSdk 36

    defaultConfig {
        applicationId "org.nayagram.ngbrowser"
        minSdk 21
        targetSdk 36
        versionCode 3578
        versionName "v3.12.18 NG"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    // Per-ABI APKs keep direct-download APK smaller (~145 MB) than the multi-ABI Play Store AAB (~218 MB)
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }

    // Play Store AAB automatically bundles arm64-v8a, armeabi-v7a & x86_64 (~218 MB) and delivers ~73 MB per device
    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = false
        }
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty('RELEASE_STORE_FILE') ?: System.getenv('RELEASE_STORE_FILE')
            if (storeFilePath) {
                def storeFileObj = file(storeFilePath)
                if (storeFileObj.exists()) {
                    storeFile storeFileObj
                    storePassword ((project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')) ?: '').toString().trim()
                    keyAlias ((project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS')) ?: '').toString().trim()
                    keyPassword ((project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD')) ?: '').toString().trim()
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storeFilePath = project.findProperty('RELEASE_STORE_FILE') ?: System.getenv('RELEASE_STORE_FILE')
            if (storeFilePath && file(storeFilePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Ensures 16 KB page-size alignment for Google Play Android 15+/16+ compliance
            useLegacyPackaging = false
            // Exclude legacy 32-bit x86 while preserving arm64-v8a, armeabi-v7a & x86_64 in the AAB
            excludes += ['**/x86/**']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    // Standalone Native C++/Rust Browser Engine (Mozilla GeckoView 140 ESR, 16 KB ELF aligned)
    implementation "org.mozilla.geckoview:geckoview-omni:140.0.20250707120347"

    // Modern AndroidX & Material UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}
