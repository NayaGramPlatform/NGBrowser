substitutions:
  - description: |-
      Create BraveBrowserViewTabbedLayoutImpl instead of
      BrowserViewTabbedLayoutImpl

      The Brave subclass is declared in
      brave/browser/ui/views/frame/layout/brave_browser_view_tabbed_layout_impl.h,
      which is included by the chromium_src override.
    regex:
      pattern: 'std::make_unique<BrowserViewTabbedLayoutImpl>('
      replace: 'std::make_unique<BraveBrowserViewTabbedLayoutImpl>('
