substitutions:
  - description: |-
      Make BrowserFrameViewLinux extend BraveOpaqueBrowserFrameView

      Both the base class and the METADATA_HEADER parent must be switched so
      Brave's frame view customizations apply on Linux.
    regex:
      re_pattern:
        'class BrowserFrameViewLinux : public OpaqueBrowserFrameView,(\s*public
        ui::WindowButtonOrderObserver
        \{\s*)METADATA_HEADER\(BrowserFrameViewLinux, OpaqueBrowserFrameView\)'
      replace:
        'class BrowserFrameViewLinux : public
        BraveOpaqueBrowserFrameView,\1METADATA_HEADER(BrowserFrameViewLinux,
        BraveOpaqueBrowserFrameView)'
