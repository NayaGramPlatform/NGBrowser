substitutions:
  - description: |-
      Create BraveSystemMenuModelBuilder instead of SystemMenuModelBuilder

      The Brave subclass is declared in
      brave/browser/ui/views/frame/brave_system_menu_model_builder.h, which is
      included by the chromium_src override.
    regex:
      pattern: 'std::make_unique<SystemMenuModelBuilder>('
      replace: 'std::make_unique<BraveSystemMenuModelBuilder>('
