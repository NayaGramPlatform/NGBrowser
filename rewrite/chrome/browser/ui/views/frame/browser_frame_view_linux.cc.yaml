substitutions:
  - description: |-
      Construct BraveOpaqueBrowserFrameView as the base class

      BrowserFrameViewLinux derives from BraveOpaqueBrowserFrameView (see
      browser_frame_view_linux.h), so its constructor must initialize that base.
    regex:
      pattern: ': OpaqueBrowserFrameView(widget, browser_view, layout)'
      replace: ': BraveOpaqueBrowserFrameView(widget, browser_view, layout)'
  - description: |-
      Call BraveOpaqueBrowserFrameView::NonClientHitTest

      Keeps the base-class call in sync with the renamed base class.
    regex:
      pattern: 'OpaqueBrowserFrameView::NonClientHitTest(point)'
      replace: 'BraveOpaqueBrowserFrameView::NonClientHitTest(point)'
